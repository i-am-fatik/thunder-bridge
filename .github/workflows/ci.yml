name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  gateway:
    name: a regression in the gateway, or a type it no longer holds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - name: one version for the gateway and the client it talks to
        run: |
          stated() { awk '/^info:/ { inside = 1 } inside && /^  version:/ { print $2; exit }' "$1"; }
          gateway_spec=$(stated openapi.yaml)
          gateway_package=$(node -p "require('./package.json').version")
          client_spec=$(stated sdk/openapi.yaml)
          client_package=$(node -p "require('./sdk/package.json').version")
          for other in "$gateway_package" "$client_spec" "$client_package"; do
            test "$gateway_spec" = "$other" || {
              echo "one release, four version lines: $gateway_spec $gateway_package $client_spec $client_package"
              exit 1
            }
          done

  client:
    name: a regression in the SDK, or a package nobody can consume
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:pkg

  advisories:
    name: a dependency carrying a reported vulnerability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19
      - run: npm audit --audit-level=moderate
      - run: npm audit --audit-level=moderate
        working-directory: sdk

  image:
    name: the artifact that actually ships
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --tag thunder-bridge:ci .
