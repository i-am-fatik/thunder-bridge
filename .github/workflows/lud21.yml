name: lud21

on:
  schedule:
    - cron: "23 4 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  coverage:
    name: a wallet this service promises and no longer serves, or refuses and now could
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19
          cache: npm
      - run: npm ci
      - name: measure who releases a preimage today
        run: node tools/lud21-harvest.ts "$(date -u +%Y-%m-%d)" measured.json
      - name: the overview, and what moved since the last one
        shell: bash
        run: |
          node tools/lud21-report.ts measured.json docs/lud21-measured.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lud21-measured
          path: measured.json
          retention-days: 90
