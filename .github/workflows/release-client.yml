name: release-client

on:
  push:
    tags: ["sdk-v*"]

permissions:
  contents: read

jobs:
  version:
    name: a client tag that is not the version npm gets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: a tag that is not the version it claims
        run: |
          tagged=${GITHUB_REF_NAME#sdk-v}
          package=$(node -p "require('./sdk/package.json').version")
          test "$tagged" = "$package" || {
            echo "the tag says $tagged and sdk/package.json says $package"
            exit 1
          }

  publish:
    name: the tarball npm gets, built by the run that staged it
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:pkg
      - run: npm stage publish
